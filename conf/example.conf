

client_timeout 75;
client_header_buffer_size 2k;

server {
	listen 0.0.0.0:8083;
	# root /home/vic/Documents/webserver/www;
	index index.html;
	autoindex on;
	cgi_bin .py /usr/bin/python3;
	cgi_bin .pl /usr/bin/perl;
	location / {
		autoindex on;
		index index.html;
	}
	location /test_folder {
		autoindex on;
	}
	location /cgi-bin {
		allowed_methods GET POST;
		upload_directory /home/vic/Documents/webserver/www/uploads/;
	}
	location /cgi-bin/delete_file.py {
		allowed_methods GET DELETE;
		upload_directory /home/vic/Documents/webserver/www/uploads/;
	}
	location /rover {
		allowed_methods GET;
		return 301 "https://cdn.sanity.io/files/4zrzovbb/website/a62d1ae88259144dd376b5920c592476a5ad45e5.mp4";
	}
}
client_max_body_size 7M;

server {
	listen localhost:8090;
}
server {
    listen 8080;
    listen 0.0.0.0:8081;
    listen localhost:8090;

    server_name example.org www.example.org example.org;
    server_name example.org www.example.com;

    #root /home/vic/Documents/webserver/www;

    # CGI Configuration for .pl and .py files:
    cgi_bin .pl /usr/bin/perl;
    cgi_bin .py /usr/bin/python3;

    error_page 400 /400.html;    # BAD REQUEST
    error_page 404 /404.html;    # NOT FOUND
    error_page 405 /405.html;    # METHOD NOT ALLOWED
    error_page 413 /413.html;    # REQUEST ENTITY TOO LARGE
    error_page 500 /500.html;    # INTERNAL SERVER ERROR
    error_page 505 /505.html;    # HTTP VERSION NOT SUPPORTED

    autoindex on;
    allowed_methods GET POST DELETE;

    # Default server-level redirect for unmatched requests:
    return 200 "<html><body><h1>Response from here</h1></body></html>";


    index index.html;

    # Location blocks:

    # Default location for static content
    location / {
        index index.html;
    }

    location /foo/ {
        allowed_methods GET;
    }

    location /foo/bar/ {
        autoindex off;
    }

    # A location block overriding the server-level return:
    location /special {
        return 302 http://example.com/special;
    }

    # POST and DELETE are handled by CGI scripts under /cgi-bin.
    # upload_directory is passed as UPLOAD_DIR env var to the script.
    location /cgi-bin {
        allowed_methods GET POST DELETE;
        upload_directory /var/www/uploads;
    }
}


server {
    listen localhost:8091;
    server_name static.site;
    index index.html home.html;
    error_page 404 /404.html;
	#root /home/vic/Documents/webserver/www;
	cgi_bin .py /usr/bin/python3;
	cgi_bin .pl /usr/bin/perl;
    # Default location for static files:
    location / {
        autoindex on;
    }
	location /cgi-bin{
		allowed_methods GET POST DELETE;
		upload_directory /home/vic/Documents/webserver/www/uploads/;
	}
	location /test_folder {
		autoindex on;
	}

    # HTTP Redirect example:
    location /old-path {
        return 301 http://example.com/new-path;
    }
}

