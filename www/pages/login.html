<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Simple Login</title>
	<link rel="icon" href="/favicon.ico">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Eczar:wght@400;700;800&display=swap">
	<link rel="stylesheet" href="/style/styles.css">
	<script>
		function checkSession() {
			const cookies = document.cookie.split(';');
			for (let cookie of cookies) {
				const [name, value] = cookie.trim().split('=');
				if (name === 'session_id' && value) {
					window.location.href = '/cgi-bin/login.py';
					return;
				}
			}
		}
		window.onload = checkSession;
	</script>
</head>
<body>
	<nav>
		<ul>
			<li><a href="../index.html">Home</a></li>
		</ul>
	</nav>
	<main>
		<h2 class="subtitle">Simple Login</h2>
		<form action="/cgi-bin/login.py" method="post">
			<label for="username">Username:</label>
			<input type="text" id="username" name="username" required>
			<button type="submit">Login</button>
		</form>
	</main>
</body>
</html>
